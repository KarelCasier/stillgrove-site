<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;background:#080e0b}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:#eaf3e7;
    -webkit-font-smoothing:antialiased;
    height:100%;height:100dvh;
    display:flex;flex-direction:column;
    overflow:hidden;
    position:relative;
  }
  ::selection{background:rgba(221,255,156,.25)}
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(60vmin 60vmin at 50% 30%, rgba(67,203,123,.10), transparent 70%);
  }
  .topbar{
    position:relative;z-index:2;
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(.9rem + env(safe-area-inset-top, 0px)) 1.4rem 0;
    opacity:0;transform:translateY(-8px);
    transition:opacity .8s ease .05s, transform .8s ease .05s;
  }
  body.ready .topbar{opacity:1;transform:none}
  .brand{font-family:'Comfortaa',sans-serif;font-weight:700;font-size:.95rem;letter-spacing:.34em;text-transform:uppercase;color:#eaf3e7}
  .pill{
    font-size:.68rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase;
    color:#ddff9c;border:1px solid rgba(221,255,156,.35);border-radius:999px;
    padding:.5rem 1rem .5rem 1.25rem;background:rgba(221,255,156,.06);
  }
  #splash{
    position:relative;z-index:1;
    flex:0 0 auto;
    height:min(48dvh, 195vw);
    max-width:96vw;
    aspect-ratio:390 / 844;
    margin:auto;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer;
  }
  #splash svg{display:block;width:100%;height:100%;background:#080e0b}
  #splash:focus-visible{outline:1px solid #b2ed8b;outline-offset:4px}
  #intro{
    position:relative;z-index:2;
    text-align:center;
    padding:.4rem 1.5rem calc(1.4rem + env(safe-area-inset-bottom, 0px));
  }
  #intro>*{opacity:0;transform:translateY(26px);transition:opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1)}
  body.ready #intro>*{opacity:1;transform:none}
  body.ready #intro>*:nth-child(1){transition-delay:.18s}
  body.ready #intro>*:nth-child(2){transition-delay:.30s}
  body.ready #intro>*:nth-child(3){transition-delay:.44s}
  body.ready #intro>*:nth-child(4){transition-delay:.58s}
  h1{
    font-family:'Comfortaa',sans-serif;font-weight:700;
    font-size:clamp(2.7rem, 11vw, 6.2rem);
    line-height:1.02;letter-spacing:-.015em;
    margin:0 0 1rem;color:#eaf3e7;text-wrap:balance;
  }
  h1 .grad{
    background:linear-gradient(100deg,#a6ed80 0%,#36c978 55%,#2bd98a 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{
    margin:0 auto 1.7rem;max-width:36ch;
    color:rgba(234,243,231,.66);
    font-size:clamp(.98rem, 2.6vw, 1.18rem);line-height:1.65;
  }
  .sub strong{color:#eaf3e7;font-weight:600}
  .cta{
    display:inline-block;
    font-size:1rem;font-weight:600;letter-spacing:.03em;
    color:#080e0b;text-decoration:none;
    background:#ddff9c;border-radius:999px;
    padding:1rem 2.6rem;
    box-shadow:0 8px 32px rgba(157,238,114,.22);
    transition:transform .25s, box-shadow .25s, background .25s;
  }
  .cta:hover{transform:translateY(-2px);background:#eaffbe;box-shadow:0 12px 40px rgba(157,238,114,.32)}
  .cta:focus-visible{outline:2px solid #eaf3e7;outline-offset:3px}
  .foot{
    margin:1.5rem 0 0;
    font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(234,243,231,.38);
  }
  .foot .dot{margin:0 .7em;color:rgba(234,243,231,.22)}
  @media (max-height:640px){
    #splash{height:min(38dvh, 195vw)}
    h1{font-size:clamp(2.1rem, 8vw, 3.4rem)}
    .sub{margin-bottom:1.1rem}
    .cta{padding:.8rem 2rem}
    .foot{margin-top:1rem}
  }
  @media (prefers-reduced-motion:reduce){
    #intro>*, .topbar{transition:none}
  }

// One deterministic clock drives live playback and rendered frame exports.
const duration = 4.2;
const mobileDuration = 2.6;
const profiles={
  studio:{duration,leafStart:.10,leafSpan:1.93,wordStart:1.08,wordSpan:2.34},
  mobile:{duration:mobileDuration,leafStart:.08,leafSpan:1.30,wordStart:.70,wordSpan:1.12}
};
const TAU = Math.PI * 2;
const clamp = x => Math.max(0, Math.min(1, x));
const ease = x => { x=clamp(x); return x*x*(3-2*x); };
const fmt = x => Number(x.toFixed(3));
const point = (x,y) => `${fmt(x)} ${fmt(y)}`;
const polygon = points => points.length ? 'M'+points.map(p=>point(...p)).join('L')+'Z' : 'M0 0Z';
const delays = [0,.066,.137,.214];
const crestVariants=[
  {id:'current',number:'01',name:'Original',description:'Fine ripple, evenly spaced colors.',delays,amplitude:9.6,growth:.05,frequency:5,harmonic:9,mix:.3,speed:1.65,secondarySpeed:1.7},
  {id:'broad',number:'02',name:'Broad crest',description:'A wider lime edge makes the front clearer.',delays:[0,.12,.20,.28],amplitude:9.6,growth:.05,frequency:5,harmonic:9,mix:.3,speed:1.65,secondarySpeed:1.7},
  {id:'swell',number:'03',name:'Soft swell',description:'Larger, rounder waves roll across the leaf.',delays:[0,.085,.17,.25],amplitude:14,growth:.12,frequency:3,harmonic:6,mix:.16,speed:1.18,secondarySpeed:1.4},
  {id:'tight',number:'04',name:'Close wake',description:'Closer color bands and a livelier ripple.',delays:[0,.04,.10,.165],amplitude:12,growth:.085,frequency:7,harmonic:11,mix:.25,speed:2.05,secondarySpeed:2.2}
];
const crestOf=id=>crestVariants.find(crest=>crest.id===id)||crestVariants[0];

// Fuller, smooth contours extend the reference's Echo mark. Only the moving
// boundary carries a ripple; the finished silhouette is optically quiet.
const arcs = [
  {rx:43,ry:48,start:-1.89,end:1.72,width:13.8,begin:.18,span:1.27},
  {rx:74,ry:81,start:-1.93,end:1.76,width:18.4,begin:.32,span:1.70}
];
function curve(a,u) {
  const theta=a.start+(a.end-a.start)*u;
  const x=49+a.rx*Math.cos(theta),y=94+a.ry*Math.sin(theta);
  const dx=-a.rx*Math.sin(theta),dy=a.ry*Math.cos(theta),len=Math.hypot(dx,dy);
  const tx=dx/len,ty=dy/len;
  const width=a.width*(.74+.30*Math.sin(Math.PI*clamp(u))+.10*clamp(u));
  return {x,y,tx,ty,nx:ty,ny:-tx,w:width/2};
}
function localFlex(a,u,t,mode) {
  const p=ease((t-a.begin)/a.span);
  if(p<=0||p>=1)return 0;
  const front=-.085+1.18*p;
  const single=Math.exp(-Math.pow((u-front)/.1,2));
  const half=-.085+.68*p;
  const double=Math.exp(-Math.pow((u-half)/.1,2))+Math.exp(-Math.pow((u-(1-half))/.1,2));
  return (mode==='dual'?double:single)*1.3*Math.sin(Math.PI*p);
}
function side(a,u,v,extra=0,t=duration,mode='single') {
  const q=curve(a,u),flex=extra?0:localFlex(a,u,t,mode);
  return [q.x+q.nx*(v*(q.w+extra+flex*.45)+flex*.42),q.y+q.ny*(v*(q.w+extra+flex*.45)+flex*.42)];
}
function ribbon(a,t,mode) {
  const points=[];
  for(let j=0;j<=80;j++)points.push(side(a,j/80,1,0,t,mode));
  let q=curve(a,1);
  for(let j=1;j<=18;j++){
    const b=Math.PI*j/18;
    points.push([q.x+q.w*(q.nx*Math.cos(b)+q.tx*Math.sin(b)),q.y+q.w*(q.ny*Math.cos(b)+q.ty*Math.sin(b))]);
  }
  for(let j=79;j>=0;j--)points.push(side(a,j/80,-1,0,t,mode));
  q=curve(a,0);
  for(let j=1;j<=18;j++){
    const b=Math.PI*j/18;
    points.push([q.x+q.w*(-q.nx*Math.cos(b)-q.tx*Math.sin(b)),q.y+q.w*(-q.ny*Math.cos(b)-q.ty*Math.sin(b))]);
  }
  return polygon(points);
}

// This mask follows arc length, with a sinusoidal nib across its thickness.
// Overscan covers rounded terminals continuously, with no final-frame swap.
function region(a,lo,hi,seconds,reverse=false) {
  if(hi<=lo)return 'M0 0Z';
  if(lo<=-.08 && hi>=1.08)return 'M-100 -100H300V300H-100Z';
  const end=Math.min(1.1,hi),start=Math.max(-.1,lo),points=[];
  const steps=Math.max(2,Math.ceil((end-start)*48));
  const wiggle=(v,u)=>.014*Math.sin(v*3.8-seconds*4.8+u*2)*Math.sin(Math.PI*(v+1)/2);
  for(let j=0;j<=steps;j++)points.push(side(a,start+(end-start)*j/steps,1,7));
  for(let j=1;j<=20;j++){
    const v=1-j/10;
    points.push(side(a,end+(!reverse?wiggle(v,end):0),v,7));
  }
  for(let j=steps-1;j>=0;j--)points.push(side(a,start+(end-start)*j/steps,-1,7));
  for(let j=1;j<=20;j++){
    const v=-1+j/10;
    points.push(side(a,start+(reverse?wiggle(v,start):0),v,7));
  }
  return polygon(points);
}
function arcMask(a,t,delay,mode) {
  const p=ease((t-a.begin-delay)/a.span);
  if(p<=0)return 'M0 0Z';
  if(mode==='dual'){
    const half=-.085+.68*p;
    return region(a,-.085,half,t)+region(a,1-half,1.085,t,true);
  }
  return region(a,-.085,-.085+1.18*p,t);
}

const colors={ink:{bg:'#080e0b',word:'#eaf3e7'},paper:{bg:'#f2f4ec',word:'#163623'}};
const gradientDefinition = id => `<linearGradient id="${id}-gradient" x1="21" y1="8" x2="113" y2="182" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a6ed80"/><stop offset=".44" stop-color="#36c978"/><stop offset="1" stop-color="#087b50"/></linearGradient>`;
function layoutOf(layout) {
  if(layout==='portrait')return {view:'0 0 390 844',mark:'translate(112.5 241)',word:'translate(83.55 461) scale(.45)',origin:[247.667,-135.556],waveEnd:370};
  if(layout==='landscape')return {view:'0 0 844 390',mark:'translate(227 115) scale(.7)',word:'translate(363.5 196) scale(.5)',origin:[-80,-32],waveEnd:720};
  return layout==='stacked'
    ? {view:'0 0 740 680',mark:'translate(246 128) scale(1.5)',word:'translate(90 485) scale(1.13)',origin:[-56,-80],waveEnd:730}
    : {view:'0 0 1120 520',mark:'translate(196 157) scale(1.1)',word:'translate(377 288) scale(1.1)',origin:[-110,-34],waveEnd:780};
}
function radiusAt(t,delay,layout,profile='studio') {
  const timing=profiles[profile]||profiles.studio;
  const p=clamp((t-timing.wordStart-delay)/timing.wordSpan);
  return p*(1.18-.18*p)*layoutOf(layout).waveEnd;
}
function wavePath(radius,t,origin,crest=crestVariants[0]) {
  if(radius<=0)return 'M-1000 -1000Z';
  const points=[];
  for(let j=0;j<=112;j++){
    const angle=j/112*TAU,amplitude=Math.min(crest.amplitude,radius*crest.growth);
    const ripple=amplitude*(Math.sin(angle*crest.frequency-t*crest.speed)+crest.mix*Math.sin(angle*crest.harmonic+t*crest.secondarySpeed));
    const r=Math.max(0,radius+ripple);
    points.push([origin[0]+Math.cos(angle)*r,origin[1]+Math.sin(angle)*r]);
  }
  return polygon(points);
}
function stateAt(seconds,{mode='single',layout='wide',emblem='echo',profile='studio',crest='current'}={}) {
  const timing=profiles[profile]||profiles.studio;
  const front=crestOf(crest);
  const t=Math.max(0,Math.min(timing.duration,seconds)),state={};
  const botanical=botanicalMarks.find(mark=>mark.id===emblem);
  if(botanical){
    front.delays.forEach((delay,j)=>{
      const p=clamp((t-timing.leafStart-delay)/timing.leafSpan);
      const radius=(p*(1.30-.30*p))*botanical.revealRadius;
      state[`leaf-wave-${j}`]=wavePath(radius,Math.min(t-delay,timing.leafStart+timing.leafSpan),botanical.origin,front);
    });
  }else{
    arcs.forEach((a,i)=>{
      state[`shape-${i}`]=ribbon(a,t,mode);
      delays.forEach((delay,j)=>state[`arc-${i}-${j}`]=arcMask(a,t,delay,mode));
    });
  }
  const l=layoutOf(layout);
  front.delays.forEach((delay,j)=>state[`wave-${j}`]=wavePath(radiusAt(t,delay,layout,profile),Math.min(t-delay,timing.wordStart+timing.wordSpan),l.origin,front));
  centers.forEach((cx,i)=>{
    const distance=Math.hypot(cx-l.origin[0],-24-l.origin[1]);
    const d=radiusAt(t,.11,layout,profile)-distance;
    const envelope=Math.exp(-Math.pow(d/34,2));
    const flex=t>timing.wordStart?envelope:0;
    const sx=1+.006*flex,sy=1+.026*flex;
    state[`glyph-${i}`]=`translate(${cx} -24) scale(${fmt(sx)} ${fmt(sy)}) translate(${-cx} 24)`;
  });
  state.seedOpacity=clamp(t/.07);
  state.seedScale=.25+.75*ease(t/.19)+.09*Math.sin(clamp((t-.16)/.45)*Math.PI)*Math.exp(-Math.max(0,t-.16)*3);
  state.phase=profile==='mobile'
    ? t<.16?'Contact':t<1.25?'The leaf wakes':t<2.05?'Stillgrove appears':'At rest'
    : t<.22?'Contact':t<1.27?'Tracing the wake':t<3.6?'Revealing the wordmark':'At rest';
  return state;
}

function svgAt(seconds,{id='aw',mode='single',finish='green',theme='ink',layout='wide',background=false,markOnly=false,emblem='echo',profile='studio',crest='current'}={}) {
  const l=layoutOf(layout),c=colors[theme]||colors.ink,state=stateAt(seconds,{mode,layout,emblem,profile,crest});
  const botanical=botanicalMarks.find(mark=>mark.id===emblem);
  const markFill=finish==='mono'?c.word:`url(#${id}-gradient)`;
  const layers=['#ddff9c','#9cee72','#43cb7b',markFill];
  let defs=gradientDefinition(id);
  if(botanical){
    defs+=`<g id="${id}-botanical" fill-rule="evenodd">${botanical.paths.map(d=>`<path d="${d}"/>`).join('')}</g>`;
    for(let j=0;j<4;j++)defs+=`<clipPath id="${id}-leafclip-${j}"><path data-motion="leaf-wave-${j}" d="${state[`leaf-wave-${j}`]}"/></clipPath>`;
  }else{
    arcs.forEach((a,i)=>{
      defs+=`<path id="${id}-shape-${i}" data-motion="shape-${i}" d="${state[`shape-${i}`]}"/><clipPath id="${id}-silhouette-${i}"><use href="#${id}-shape-${i}"/></clipPath>`;
      for(let j=0;j<4;j++)defs+=`<clipPath id="${id}-arcclip-${i}-${j}"><path data-motion="arc-${i}-${j}" d="${state[`arc-${i}-${j}`]}"/></clipPath>`;
    });
  }
  defs+=`<g id="${id}-letters">${glyphs.map((d,i)=>`<path data-motion="glyph-${i}" transform="${state[`glyph-${i}`]}" d="${d}"/>`).join('')}</g>`;
  for(let j=0;j<4;j++)defs+=`<clipPath id="${id}-waveclip-${j}"><path data-motion="wave-${j}" d="${state[`wave-${j}`]}"/></clipPath>`;
  const mark=botanical
    ? layers.map((fill,j)=>`<use href="#${id}-botanical" fill="${fill}" clip-path="url(#${id}-leafclip-${j})"/>`).join('')
    : arcs.map((a,i)=>`<g clip-path="url(#${id}-silhouette-${i})">${layers.map((fill,j)=>`<use href="#${id}-shape-${i}" fill="${fill}" clip-path="url(#${id}-arcclip-${i}-${j})"/>`).join('')}</g>`).join('');
  const seedFill=finish==='mono'?c.word:'#a9f39b';
  const seed=botanical?'':`<g data-motion="seed" opacity="${state.seedOpacity}" transform="translate(38 94) scale(${state.seedScale})"><circle r="9" fill="${seedFill}"/></g>`;
  const typeLayers=['#ddff9c','#9cee72','#43cb7b',c.word];
  const word=`<g transform="${l.word}">${typeLayers.map((fill,j)=>`<use href="#${id}-letters" fill="${fill}" clip-path="url(#${id}-waveclip-${j})"/>`).join('')}</g>`;
  const view=markOnly?'0 0 165 188':l.view;
  const rect=background?`<rect width="100%" height="100%" fill="${c.bg}"/>`:'';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${view}" role="img" aria-label="Stillgrove studio identity"><defs>${defs}</defs>${rect}<g transform="${markOnly?'translate(5 0)':l.mark}">${seed}${mark}</g>${markOnly?'':word}</svg>`;
}

// Editable vector exports contain just the finished contours and gradient.
function staticSVG({id='stillgrove',finish='green',theme='ink',layout='wide',markOnly=false,emblem='echo',background=false}={}) {
  const l=layoutOf(layout),c=colors[theme]||colors.ink;
  const botanical=botanicalMarks.find(mark=>mark.id===emblem);
  const fill=finish==='mono'?c.word:`url(#${id}-gradient)`;
  const seedFill=finish==='mono'?c.word:'#a9f39b';
  const mark=botanical
    ? botanical.paths.map(d=>`<path d="${d}" fill="${fill}" fill-rule="evenodd"/>`).join('')
    : `<circle cx="38" cy="94" r="9" fill="${seedFill}"/>${arcs.map(a=>`<path d="${ribbon(a,duration,'single')}" fill="${fill}"/>`).join('')}`;
  const word=`<g transform="${l.word}" fill="${c.word}">${glyphs.map(d=>`<path d="${d}"/>`).join('')}</g>`;
  const rect=background?`<rect width="100%" height="100%" fill="${c.bg}"/>`:'';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${markOnly?'0 0 165 188':l.view}" role="img" aria-label="Stillgrove studio identity"><defs>${gradientDefinition(id)}</defs>${rect}<g transform="${markOnly?'translate(5 0)':l.mark}">${mark}</g>${markOnly?'':word}</svg>`;
}

function bindMotion(svg,options={}) {
  const nodes=new Map([...svg.querySelectorAll('[data-motion]')].map(el=>[el.dataset.motion,el]));
  return seconds=>{
    const state=stateAt(seconds,options);
    for(const [key,node] of nodes){
      if(key==='seed'){
        node.setAttribute('opacity',state.seedOpacity);
        node.setAttribute('transform',`translate(38 94) scale(${state.seedScale})`);
      } else if(key.startsWith('glyph-'))node.setAttribute('transform',state[key]);
      else node.setAttribute('d',state[key]);
    }
    return state;
  };
}

// Landing-page player: the approved mobile splash (maple-river, broad crest),
// then the coming-soon content fades in. Tap replays.
const host=document.getElementById('splash');
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
const orientation=matchMedia('(orientation: landscape)');
const crest='broad';
const splashDuration=mobileDuration;
const layout=()=>orientation.matches?'landscape':'portrait';
let frame=0,started=0,render,elapsed=0,loopTimer=0;
const LOOP_PAUSE=1600;

function showIntro(){document.body.classList.add('ready');}
function hideIntro(){document.body.classList.remove('ready');}

function mount(){
  const options={layout:layout(),profile:'mobile',emblem:'maple-river',background:true,crest};
  host.style.aspectRatio=options.layout==='portrait'?'390 / 844':'844 / 390';
  host.innerHTML=svgAt(reducedMotion.matches?splashDuration:0,{...options,id:'stillgrove'});
  render=bindMotion(host.firstElementChild,options);
}
function tick(now){
  if(!started)started=now;
  elapsed=Math.min(splashDuration,(now-started)/1000);
  render(elapsed);
  if(elapsed<splashDuration){frame=requestAnimationFrame(tick);}
  else{
    frame=0;
    host.dispatchEvent(new CustomEvent('stillgrove:complete',{bubbles:true}));
    clearTimeout(loopTimer);
    loopTimer=setTimeout(()=>{if(!document.hidden&&!reducedMotion.matches)play();},LOOP_PAUSE);
  }
}
function play(){
  clearTimeout(loopTimer);
  cancelAnimationFrame(frame);started=0;elapsed=0;render(0);
  frame=requestAnimationFrame(tick);
}
host.addEventListener('stillgrove:complete',showIntro);
host.addEventListener('pointerup',play);
host.addEventListener('keydown',event=>{
  if(event.code==='Space'||event.code==='Enter'){event.preventDefault();play();}
});
orientation.addEventListener('change',()=>{clearTimeout(loopTimer);cancelAnimationFrame(frame);hideIntro();mount();if(!reducedMotion.matches)play();else showIntro();});
reducedMotion.addEventListener('change',event=>{if(event.matches){clearTimeout(loopTimer);cancelAnimationFrame(frame);frame=0;render(splashDuration);showIntro();}});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){cancelAnimationFrame(frame);frame=0;render(splashDuration);}
});
mount();
if(reducedMotion.matches)showIntro();
else requestAnimationFrame(()=>requestAnimationFrame(play));

</script>
