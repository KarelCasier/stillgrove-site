<style>
:root{
  --bg:#131a15;
  --ink:#e7e3d6;
  --muted:#8f998c;
  --faint:#5d685f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* Fireflies return once the logo has settled. */
.fireflies{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden;opacity:0;transition:opacity 2.4s ease .3s}
body.ready .fireflies{opacity:1}
.fireflies span{
  position:absolute;left:var(--x);top:var(--y);
  width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle,rgba(246,242,214,.95) 0%,rgba(226,222,176,.45) 38%,rgba(200,200,150,0) 70%);
  box-shadow:0 0 12px 3px rgba(226,222,176,.22);
  opacity:0;
  animation:drift var(--d) ease-in-out var(--dl) infinite alternate,
            flicker var(--d) ease-in-out var(--dl) infinite alternate;
}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}
@keyframes flicker{0%,100%{opacity:0}30%{opacity:var(--o)}55%{opacity:calc(var(--o)*.3)}80%{opacity:var(--o)}}
.top{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  padding:22px clamp(20px,4vw,44px);
}
.brand{display:block;opacity:.9}
.brand svg{display:block;height:24px;width:auto}
.hero{
  position:relative;z-index:1;flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:16px 24px 28px;width:100%;
}
#splash{position:relative;width:min(380px,80vw);aspect-ratio:400/292;margin:0 auto;outline:none;cursor:pointer}
#splash:focus-visible{outline:2px solid var(--ink);outline-offset:10px;border-radius:12px}
#splash svg{display:block;width:100%;height:100%}
.soon{
  margin-top:clamp(22px,4vh,40px);
  font-weight:500;font-size:.7rem;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;color:var(--muted);
  opacity:0;transition:opacity 1.1s ease .2s;
}
body.ready .soon{opacity:1}
.cta{
  display:inline-block;margin-top:26px;
  background:var(--ink);color:var(--bg);
  font-weight:500;font-size:.88rem;letter-spacing:.03em;
  padding:.9em 2.1em;border-radius:6px;text-decoration:none;
  opacity:0;transform:translateY(8px);
  transition:opacity .9s ease .4s,transform .9s ease .4s,background .2s ease;
}
body.ready .cta{opacity:1;transform:none}
.cta:hover{background:#f4f1e8}
.cta:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
footer{
  position:relative;z-index:2;text-align:center;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));
  font-size:.62rem;letter-spacing:.32em;color:var(--faint);
}
footer .privacy-link{
  display:inline-block;margin-top:14px;padding:8px;
  color:var(--muted);font-size:.75rem;letter-spacing:normal;
  text-underline-offset:4px;
}
footer .privacy-link:hover{color:var(--ink)}
footer .privacy-link:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
@media (max-width:640px){
  #splash{width:min(300px,78vw)}
  .hero{justify-content:flex-start;padding-top:8vh}
  .brand svg{height:20px}
  footer{letter-spacing:.2em}
}
@media (prefers-reduced-motion:reduce){
  .fireflies{display:none}
  .soon,.cta{transition:none}
}
</style>

<script>
// Stillgrove identity: a birch "pause" symbol, a wordmark whose double l is the same two trunks,
// palettes, and several reveal styles that all end in stillness.
const SG = (() => {
  const F = v => Math.round(v * 100) / 100;
  const clamp = x => Math.max(0, Math.min(1, x));
  const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
  const out3 = x => 1 - Math.pow(1 - clamp(x), 3);
  const TAU = Math.PI * 2;

  function trunk(xb, wb, lean, top, bot, taper) {
    const wt = wb * taper, xc = xb + wb / 2 + lean, xl = xc - wt / 2, xr = xc + wt / 2;
    const edges = y => { const k = (bot - y) / (bot - top); return [xb + (xl - xb) * k, xb + wb + (xr - xb - wb) * k]; };
    return { d: `M${F(xb)} ${bot}L${F(xl)} ${top}L${F(xr)} ${top}L${F(xb + wb)} ${bot}Z`, edges, base: [xb + wb / 2, bot] };
  }
  // A birch lenticel: a dark dash that starts at the trunk's edge and tapers inward.
  function lenticel(t, y, frac, side, th, tilt = 0) {
    if (frac <= .005) return '';
    const [l, r] = t.edges(y), e = side ? r : l, i = side ? r - frac * (r - l) : l + frac * (r - l), h = th / 2, hi = th * .14;
    return `M${F(e)} ${F(y - h)}L${F(i)} ${F(y - hi + tilt)}L${F(i)} ${F(y + hi + tilt)}L${F(e)} ${F(y + h)}Z`;
  }

  // Symbol geometry, in a 200 x 200 box.
  const V = { ring: 78, crop: 67, trunks: [[56, 34, -1.4], [110, 34, 1.4]], base: 167, taper: .93,
    marks: [[0, 46, .4, 0, .3], [0, 64, .22, 1, -.2], [0, 84, .48, 0], [0, 103, .28, 1, .3], [0, 103, .14, 0], [0, 124, .42, 0, -.3], [0, 143, .24, 1], [0, 158, .3, 0],
      [1, 52, .34, 1, -.3], [1, 71, .44, 0, .2], [1, 91, .22, 1], [1, 91, .12, 0], [1, 112, .48, 1, -.2], [1, 131, .3, 0, .3], [1, 150, .38, 1]] };
  const SMALL = [[0, 72, .55, 0], [0, 118, .42, 1], [1, 84, .55, 1], [1, 130, .42, 0]];
  // k = 0 draws two straight bars (a plain pause sign); k = 1 draws the finished birch trunks.
  const trunksAt = k => V.trunks.map(([x, w, lean]) => trunk(x, w, lean * k, 0, 200, 1 - (1 - V.taper) * k));
  const marksD = (ts, i, small, grow = () => 1) => (small ? SMALL : V.marks).map((m, j) => [m, j]).filter(([m]) => m[0] === i)
    .map(([[, y, f, s, tl], j]) => lenticel(ts[i], y, f * grow(j), s, small ? 11 : 6.6, tl || 0)).join('');

  function symbol(p, { small = false, ring = true } = {}) {
    const ts = trunksAt(1);
    const defs = `<clipPath id="${p}-c"><circle cx="100" cy="100" r="${V.crop}"/></clipPath>` +

          const inWord = key[0] === 'w', i = inWord ? (key === 'w3' ? 0 : 1) : +key, t0 = RV.gust + i * .14 + (inWord ? .08 : 0);
          const a = t > t0 && !fin ? (inWord ? 1.6 : 2.4) * Math.sin(TAU * 1.05 * (t - t0)) * Math.exp(-(t - t0) * 2.6) : 0;
          el.setAttribute('transform', `translate(${base[0]} ${base[1]}) skewX(${F(a)}) translate(${-base[0]} ${-base[1]})`);
        });
        glyphs.forEach((g, i) => {
          const k = style === 'mist' ? 1 : ease((t - wordT - i * .045) / .5);
          g.setAttribute('opacity', F(k));
          g.setAttribute('transform', `translate(0 ${F((1 - k) * 7)})`);
        });
      };
    }
    return { svg: markup, bind, duration: RV.end };
  }
  return { svg, stage, PALETTES, REVEALS, LAYOUT };
})();

// Landing-page player: the reveal plays once, then the page settles. Tap or press Enter to replay.
(function(){
  var host = document.getElementById('splash');
  var reduced = matchMedia('(prefers-reduced-motion: reduce)');
  var stage = SG.stage({ palette: 'forest', reveal: 'light' });
  var frame = 0, started = 0, render;
  host.innerHTML = stage.svg;
  render = stage.bind(host);
  function ready(){ document.body.classList.add('ready'); }
  function finish(){ cancelAnimationFrame(frame); frame = 0; render(stage.duration); ready(); }
  function tick(now){
    if(!started) started = now;
    var t = (now - started) / 1000;
    render(t);
    if(t < stage.duration) frame = requestAnimationFrame(tick);
    else { frame = 0; ready(); }
  }
  function play(){
    if(reduced.matches){ finish(); return; }
    cancelAnimationFrame(frame); started = 0; render(0);
    frame = requestAnimationFrame(tick);
  }
  host.addEventListener('pointerup', play);
  host.addEventListener('keydown', function(e){
    if(e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); play(); }
  });
  reduced.addEventListener('change', function(e){ if(e.matches) finish(); });
  document.addEventListener('visibilitychange', function(){ if(document.hidden) finish(); });
  // The page content never waits longer than this, even if animation frames are throttled.
  setTimeout(ready, (stage.duration + 1) * 1000);
  if(reduced.matches) finish();
  else { render(0); requestAnimationFrame(function(){ requestAnimationFrame(play); }); }
})();
</script>
